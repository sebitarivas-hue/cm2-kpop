<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-label="Localisation des phases MOF dans le végétal"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a53a25"/></marker><pattern id="paper" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".6" fill="#9a927d" opacity=".12"/></pattern></defs><rect x="0" y="0" width="1440" height="1020" rx="0" fill="#f7f1e6" stroke="none"/><rect x="0" y="0" width="1440" height="1020" rx="0" fill="url(#paper)" stroke="none"/><path d="M54 54L1386 54" fill="none" stroke="#6f7969" stroke-width="1.2"/><text x="55" y="35" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#344c3e">CHIMIE DOUCE / ATLAS SCIENTIFIQUE</text><text x="1045" y="35" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500" fill="#394e43">CLÉMENT SANCHEZ / COLLÈGE DE FRANCE · 2020</text><text x="55" y="120" font-family="Georgia,Times New Roman,serif" font-size="43" font-weight="600" fill="#1a2925">56  Localisation des phases MOF dans le végétal</text><text x="56" y="158" font-family="Georgia,Times New Roman,serif" font-size="24" font-weight="400" fill="#7f4c35">Du tissu à l'interface : observer, cartographier et vérifier</text><path d="M55 180L1385 180" fill="none" stroke="#aa3c25" stroke-width="3"/><text x="58" y="217" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#876344">CARTOGRAPHIE DES TISSUS</text><rect x="50" y="230" width="922" height="620" rx="1" fill="#faf5ec" stroke="#c6b79e"/><circle cx="490" cy="515" r="235" fill="#e7ddc2" stroke="#3f6651" stroke-width="4"/><ellipse cx="685" cy="515" rx="32" ry="56" transform="rotate(0 685 515)" fill="#b3c4a6" stroke="#5b7b61" stroke-width="2"/><ellipse cx="658.8749537379656" cy="612.5" rx="32" ry="56" transform="rotate(30 658.8749537379656 612.5)" fill="#b3c4a6" stroke="#5b7b61" stroke-width="2"/><ellipse cx="587.5" cy="683.8749537379655" rx="32" ry="56" transform="rotate(60 587.5 683.8749537379655)" fill="#b3c4a6" stroke="#5b7b61" stroke-width="2"/><ellipse cx="490" cy="710" rx="32" ry="56" transform="rotate(90 490 710)" fill="#b3c4a6" stroke="#5b7b61" stroke-width="2"/><ellipse cx="392.50000000000006" cy="683.8749537379656" rx="32" ry="56" transform="rotate(120 392.50000000000006 683.8749537379656)" fill="#b3c4a6" stroke="#5b7b61" stroke-width="2"/><ellipse cx="321.12504626203446" cy="612.5" rx="32" ry="56" transform="rotate(150 321.12504626203446 612.5)" fill="#b3c4a6" stroke="#5b7b61" stroke-width="2"/><ellipse cx="295" cy="515" rx="32" ry="56" transform="rotate(180 295 515)" fill="#b3c4a6" stroke="#5b7b61" stroke-width="2"/><ellipse cx="321.1250462620344" cy="417.50000000000006" rx="32" ry="56" transform="rotate(210 321.1250462620344 417.50000000000006)" fill="#b3c4a6" stroke="#5b7b61" stroke-width="2"/><ellipse cx="392.4999999999999" cy="346.1250462620345" rx="32" ry="56" transform="rotate(240 392.4999999999999 346.1250462620345)" fill="#b3c4a6" stroke="#5b7b61" stroke-width="2"/><ellipse cx="489.99999999999994" cy="320" rx="32" ry="56" transform="rotate(270 489.99999999999994 320)" fill="#b3c4a6" stroke="#5b7b61" stroke-width="2"/><ellipse cx="587.5" cy="346.1250462620345" rx="32" ry="56" transform="rotate(300 587.5 346.1250462620345)" fill="#b3c4a6" stroke="#5b7b61" stroke-width="2"/><ellipse cx="658.8749537379655" cy="417.4999999999999" rx="32" ry="56" transform="rotate(330 658.8749537379655 417.4999999999999)" fill="#b3c4a6" stroke="#5b7b61" stroke-width="2"/><circle cx="320" cy="365" r="8" fill="#b54c39" stroke="#695941" stroke-width="1"/><circle cx="409" cy="365" r="8" fill="#c4a36b" stroke="#695941" stroke-width="1"/><circle cx="498" cy="365" r="8" fill="#c4a36b" stroke="#695941" stroke-width="1"/><circle cx="587" cy="365" r="8" fill="#b54c39" stroke="#695941" stroke-width="1"/><circle cx="676" cy="365" r="8" fill="#c4a36b" stroke="#695941" stroke-width="1"/><circle cx="320" cy="456" r="8" fill="#c4a36b" stroke="#695941" stroke-width="1"/><circle cx="409" cy="456" r="8" fill="#b54c39" stroke="#695941" stroke-width="1"/><circle cx="498" cy="456" r="8" fill="#c4a36b" stroke="#695941" stroke-width="1"/><circle cx="587" cy="456" r="8" fill="#c4a36b" stroke="#695941" stroke-width="1"/><circle cx="676" cy="456" r="8" fill="#b54c39" stroke="#695941" stroke-width="1"/><circle cx="320" cy="547" r="8" fill="#c4a36b" stroke="#695941" stroke-width="1"/><circle cx="409" cy="547" r="8" fill="#c4a36b" stroke="#695941" stroke-width="1"/><circle cx="498" cy="547" r="8" fill="#b54c39" stroke="#695941" stroke-width="1"/><circle cx="587" cy="547" r="8" fill="#c4a36b" stroke="#695941" stroke-width="1"/><circle cx="676" cy="547" r="8" fill="#c4a36b" stroke="#695941" stroke-width="1"/><circle cx="320" cy="638" r="8" fill="#b54c39" stroke="#695941" stroke-width="1"/><circle cx="409" cy="638" r="8" fill="#c4a36b" stroke="#695941" stroke-width="1"/><circle cx="498" cy="638" r="8" fill="#c4a36b" stroke="#695941" stroke-width="1"/><circle cx="587" cy="638" r="8" fill="#b54c39" stroke="#695941" stroke-width="1"/><circle cx="676" cy="638" r="8" fill="#c4a36b" stroke="#695941" stroke-width="1"/><rect x="218" y="765" width="570" height="67" rx="2" fill="#f0e6d4" stroke="#c6ae88"/><text x="240" y="797" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#314b3b">COULEURS = REPÈRES SCHÉMATIQUES</text><text x="240" y="820" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#604b41">Pas de fluorescence ni cartographie mesurée.</text><rect x="995" y="230" width="390" height="620" rx="1" fill="#f1eadc" stroke="#b9ab8e"/><text x="1021" y="272" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#294b3b">MÉCANISME ET POINTS DE CONTRÔLE</text><circle cx="1038" cy="314" r="18" fill="#9c3b27" stroke="#9c3b27" stroke-width="0"/><text x="1032" y="320" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff8ed">1</text><text x="1066" y="316" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#853b2d">01 · REPÉRER</text><text x="1020" y="351" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">Localiser des signaux dans un organe et</text><text x="1020" y="373" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">décrire les tissus.</text><path d="M1018 427L1360 427" fill="none" stroke="#c7b99f" stroke-width="2"/><circle cx="1038" cy="475" r="18" fill="#9c3b27" stroke="#9c3b27" stroke-width="0"/><text x="1032" y="481" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff8ed">2</text><text x="1066" y="477" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#853b2d">02 · CORRÉLER</text><text x="1020" y="512" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">Comparer imagerie, cartographie</text><text x="1020" y="534" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">élémentaire et témoin.</text><path d="M1018 588L1360 588" fill="none" stroke="#c7b99f" stroke-width="2"/><circle cx="1038" cy="636" r="18" fill="#9c3b27" stroke="#9c3b27" stroke-width="0"/><text x="1032" y="642" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff8ed">3</text><text x="1066" y="638" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#853b2d">03 · IDENTIFIER</text><text x="1020" y="673" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">Vérifier l'existence de la phase</text><text x="1020" y="695" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">cristalline MOF.</text><rect x="50" y="874" width="922" height="92" rx="0" fill="#ece6d8" stroke="#c2b497"/><text x="68" y="898" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#294f40">LECTURE SCIENTIFIQUE</text><text x="69" y="923" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#364638">• Une fluorescence ou un contraste ne suffit pas à identifier un MOF.</text><text x="69" y="942" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#364638">• La distribution peut être hétérogène à plusieurs échelles.</text><text x="69" y="961" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#364638">• Différencier précipité, cristallite et dépôt sur une interface.</text><rect x="995" y="874" width="390" height="92" rx="0" fill="#eadbd1" stroke="#caae9d"/><text x="1013" y="899" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#923e2d">LIMITE D'INTERPRÉTATION</text><text x="1013" y="924" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4d473d">Aucune fausse micrographie : les formes</text><text x="1013" y="942" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4d473d">représentées sont des diagrammes explicatifs.</text><path d="M54 986L1385 986" fill="none" stroke="#76694e" stroke-width="1.2"/><text x="55" y="1006" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#554d40">PLANCHE 56 / 70  —  reconstruction scientifique conceptuelle, non expérimentale ; consulter la diapositive originale du cours.</text></svg>