" ry="21" transform="rotate(-25 538 363)" fill="#9cbb86" stroke="#456951" stroke-width="2"/><ellipse cx="463" cy="416" rx="66" ry="21" transform="rotate(25 463 416)" fill="#9cbb86" stroke="#456951" stroke-width="2"/><ellipse cx="538" cy="469" rx="66" ry="21" transform="rotate(-25 538 469)" fill="#9cbb86" stroke="#456951" stroke-width="2"/><ellipse cx="463" cy="522" rx="66" ry="21" transform="rotate(25 463 522)" fill="#9cbb86" stroke="#456951" stroke-width="2"/><ellipse cx="538" cy="575" rx="66" ry="21" transform="rotate(-25 538 575)" fill="#9cbb86" stroke="#456951" stroke-width="2"/><ellipse cx="463" cy="628" rx="66" ry="21" transform="rotate(25 463 628)" fill="#9cbb86" stroke="#456951" stroke-width="2"/><ellipse cx="538" cy="681" rx="66" ry="21" transform="rotate(-25 538 681)" fill="#9cbb86" stroke="#456951" stroke-width="2"/><circle cx="477" cy="292" r="5" fill="#aa5640" stroke="#667357" stroke-width="1"/><circle cx="495" cy="309" r="5" fill="#b79d6b" stroke="#667357" stroke-width="1"/><circle cx="513" cy="326" r="5" fill="#b79d6b" stroke="#667357" stroke-width="1"/><circle cx="477" cy="343" r="5" fill="#aa5640" stroke="#667357" stroke-width="1"/><circle cx="495" cy="360" r="5" fill="#b79d6b" stroke="#667357" stroke-width="1"/><circle cx="513" cy="377" r="5" fill="#b79d6b" stroke="#667357" stroke-width="1"/><circle cx="477" cy="394" r="5" fill="#aa5640" stroke="#667357" stroke-width="1"/><circle cx="495" cy="411" r="5" fill="#b79d6b" stroke="#667357" stroke-width="1"/><circle cx="513" cy="428" r="5" fill="#b79d6b" stroke="#667357" stroke-width="1"/><circle cx="477" cy="445" r="5" fill="#aa5640" stroke="#667357" stroke-width="1"/><circle cx="495" cy="462" r="5" fill="#b79d6b" stroke="#667357" stroke-width="1"/><circle cx="513" cy="479" r="5" fill="#b79d6b" stroke="#667357" stroke-width="1"/><circle cx="477" cy="496" r="5" fill="#aa5640" stroke="#667357" stroke-width="1"/><circle cx="495" cy="513" r="5" fill="#b79d6b" stroke="#667357" stroke-width="1"/><circle cx="513" cy="530" r="5" fill="#b79d6b" stroke="#667357" stroke-width="1"/><circle cx="477" cy="547" r="5" fill="#aa5640" stroke="#667357" stroke-width="1"/><circle cx="495" cy="564" r="5" fill="#b79d6b" stroke="#667357" stroke-width="1"/><circle cx="513" cy="581" r="5" fill="#b79d6b" stroke="#667357" stroke-width="1"/><circle cx="477" cy="598" r="5" fill="#aa5640" stroke="#667357" stroke-width="1"/><circle cx="495" cy="615" r="5" fill="#b79d6b" stroke="#667357" stroke-width="1"/><circle cx="513" cy="632" r="5" fill="#b79d6b" stroke="#667357" stroke-width="1"/><circle cx="477" cy="649" r="5" fill="#aa5640" stroke="#667357" stroke-width="1"/><circle cx="495" cy="666" r="5" fill="#b79d6b" stroke="#667357" stroke-width="1"/><circle cx="513" cy="683" r="5" fill="#b79d6b" stroke="#667357" stroke-width="1"/><circle cx="477" cy="700" r="5" fill="#aa5640" stroke="#667357" stroke-width="1"/><circle cx="495" cy="717" r="5" fill="#b79d6b" stroke="#667357" stroke-width="1"/><path d="M260 470L418 470" fill="none" stroke="#a53a25" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 470L756 470" fill="none" stroke="#a53a25" stroke-width="3" marker-end="url(#arrow)"/><text x="208" y="433" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#9d4b34">MÉTAL + LIGAND</text><text x="649" y="433" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#9d4b34">DÉPÔT LOCAL ?</text><text x="273" y="820" font-family="Georgia,Times New Roman,serif" font-size="19" font-weight="400" fill="#2d503c">Le transport et la réaction sont en compétition.</text><rect x="995" y="230" width="390" height="620" rx="1" fill="#f1eadc" stroke="#b9ab8e"/><text x="1021" y="272" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#294b3b">MÉCANISME ET POINTS DE CONTRÔLE</text><circle cx="1038" cy="314" r="18" fill="#9c3b27" stroke="#9c3b27" stroke-width="0"/><text x="1032" y="320" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff8ed">1</text><text x="1066" y="316" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#853b2d">01 · TRANSPORTER</text><text x="1020" y="351" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">L'eau et les solutés migrent à travers</text><text x="1020" y="373" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">les tissus et conduits.</text><path d="M1018 427L1360 427" fill="none" stroke="#c7b99f" stroke-width="2"/><circle cx="1038" cy="475" r="18" fill="#9c3b27" stroke="#9c3b27" stroke-width="0"/><text x="1032" y="481" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff8ed">2</text><text x="1066" y="477" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#853b2d">02 · RENCONTRER</text><text x="1020" y="512" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">L'interaction métal–ligand peut</text><text x="1020" y="534" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">provoquer une coordination locale.</text><path d="M1018 588L1360 588" fill="none" stroke="#c7b99f" stroke-width="2"/><circle cx="1038" cy="636" r="18" fill="#9c3b27" stroke="#9c3b27" stroke-width="0"/><text x="1032" y="642" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff8ed">3</text><text x="1066" y="638" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#853b2d">03 · LOCALISER</text><text x="1020" y="673" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">La réaction concurrence diffusion,</text><text x="1020" y="695" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">dilution et transport.</text><rect x="50" y="874" width="922" height="92" rx="0" fill="#ece6d8" stroke="#c2b497"/><text x="68" y="898" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#294f40">LECTURE SCIENTIFIQUE</text><text x="69" y="923" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#364638">• La cristallisation dépend des concentrations et conditions locales.</text><text x="69" y="942" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#364638">• Une entrée de précurseurs n'implique pas une distribution homogène.</text><text x="69" y="961" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#364638">• La croissance végétale et l'effet du MOF exigent des contrôles biologiques.</text><rect x="995" y="874" width="390" height="92" rx="0" fill="#eadbd1" stroke="#caae9d"/><text x="1013" y="899" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#923e2d">LIMITE D'INTERPRÉTATION</text><text x="1013" y="924" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4d473d">Le diagramme est une hypothèse de mécanisme,</text><text x="1013" y="942" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4d473d">pas une carte mesurée des cristaux.</text><path d="M54 986L1385 986" fill="none" stroke="#76694e" stroke-width="1.2"/><text x="55" y="1006" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#554d40">PLANCHE 55 / 70  —  reconstruction scientifique conceptuelle, non expérimentale ; consulter la diapositive originale du cours.</text></svg>