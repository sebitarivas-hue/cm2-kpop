395" cy="367" rx="53" ry="33" fill="#b8564c" stroke="#8f3d37" stroke-width="2"/><ellipse cx="395" cy="367" rx="30" ry="14" fill="#e3a29a" stroke="#9f4f45" stroke-width="1.5"/><ellipse cx="545" cy="367" rx="53" ry="33" fill="#b8564c" stroke="#8f3d37" stroke-width="2"/><ellipse cx="545" cy="367" rx="30" ry="14" fill="#e3a29a" stroke="#9f4f45" stroke-width="1.5"/><ellipse cx="695" cy="367" rx="53" ry="33" fill="#b8564c" stroke="#8f3d37" stroke-width="2"/><ellipse cx="695" cy="367" rx="30" ry="14" fill="#e3a29a" stroke="#9f4f45" stroke-width="1.5"/><ellipse cx="245" cy="512" rx="53" ry="33" fill="#b8564c" stroke="#8f3d37" stroke-width="2"/><ellipse cx="245" cy="512" rx="30" ry="14" fill="#e3a29a" stroke="#9f4f45" stroke-width="1.5"/><ellipse cx="395" cy="512" rx="53" ry="33" fill="#b8564c" stroke="#8f3d37" stroke-width="2"/><ellipse cx="395" cy="512" rx="30" ry="14" fill="#e3a29a" stroke="#9f4f45" stroke-width="1.5"/><ellipse cx="545" cy="512" rx="53" ry="33" fill="#b8564c" stroke="#8f3d37" stroke-width="2"/><ellipse cx="545" cy="512" rx="30" ry="14" fill="#e3a29a" stroke="#9f4f45" stroke-width="1.5"/><ellipse cx="695" cy="512" rx="53" ry="33" fill="#b8564c" stroke="#8f3d37" stroke-width="2"/><ellipse cx="695" cy="512" rx="30" ry="14" fill="#e3a29a" stroke="#9f4f45" stroke-width="1.5"/><ellipse cx="245" cy="657" rx="53" ry="33" fill="#b8564c" stroke="#8f3d37" stroke-width="2"/><ellipse cx="245" cy="657" rx="30" ry="14" fill="#e3a29a" stroke="#9f4f45" stroke-width="1.5"/><ellipse cx="395" cy="657" rx="53" ry="33" fill="#b8564c" stroke="#8f3d37" stroke-width="2"/><ellipse cx="395" cy="657" rx="30" ry="14" fill="#e3a29a" stroke="#9f4f45" stroke-width="1.5"/><ellipse cx="545" cy="657" rx="53" ry="33" fill="#b8564c" stroke="#8f3d37" stroke-width="2"/><ellipse cx="545" cy="657" rx="30" ry="14" fill="#e3a29a" stroke="#9f4f45" stroke-width="1.5"/><ellipse cx="695" cy="657" rx="53" ry="33" fill="#b8564c" stroke="#8f3d37" stroke-width="2"/><ellipse cx="695" cy="657" rx="30" ry="14" fill="#e3a29a" stroke="#9f4f45" stroke-width="1.5"/><rect x="225" y="750" width="580" height="58" rx="2" fill="#f1e6d5" stroke="#bdac92"/><text x="246" y="787" font-family="Georgia,Times New Roman,serif" font-size="20" font-weight="600" fill="#2d4b3e">MÉTHODES : hémolyse · comptage · séparation</text><path d="M350 580L350 696" fill="none" stroke="#a53a25" stroke-width="3" marker-end="url(#arrow)"/><text x="372" y="688" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#944335">Confronter les deux conditions</text><rect x="995" y="230" width="390" height="620" rx="1" fill="#f1eadc" stroke="#b9ab8e"/><text x="1021" y="272" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#294b3b">MÉCANISME ET POINTS DE CONTRÔLE</text><circle cx="1038" cy="314" r="18" fill="#9c3b27" stroke="#9c3b27" stroke-width="0"/><text x="1032" y="320" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff8ed">1</text><text x="1066" y="316" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#853b2d">01 · EXPOSER</text><text x="1020" y="351" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">Comparer un protocole cryogénique à</text><text x="1020" y="373" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">témoins identiques.</text><path d="M1018 427L1360 427" fill="none" stroke="#c7b99f" stroke-width="2"/><circle cx="1038" cy="475" r="18" fill="#9c3b27" stroke="#9c3b27" stroke-width="0"/><text x="1032" y="481" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff8ed">2</text><text x="1066" y="477" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#853b2d">02 · DÉCONGELER</text><text x="1020" y="512" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">Mesurer l'hémoglobine libre et</text><text x="1020" y="534" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">l'intégrité des hématies.</text><path d="M1018 588L1360 588" fill="none" stroke="#c7b99f" stroke-width="2"/><circle cx="1038" cy="636" r="18" fill="#9c3b27" stroke="#9c3b27" stroke-width="0"/><text x="1032" y="642" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff8ed">3</text><text x="1066" y="638" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#853b2d">03 · SÉPARER</text><text x="1020" y="673" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">Quantifier la récupération après</text><text x="1020" y="695" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">séparation des particules.</text><rect x="50" y="874" width="922" height="92" rx="0" fill="#ece6d8" stroke="#c2b497"/><text x="68" y="898" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#294f40">LECTURE SCIENTIFIQUE</text><text x="69" y="923" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#364638">• L'hémolyse et la récupération de cellules intactes sont deux critères distincts.</text><text x="69" y="942" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#364638">• Les MOFs au zirconium doivent être séparés ou quantifiés après traitement.</text><text x="69" y="961" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#364638">• Les valeurs chiffrées relèvent exclusivement de l'étude primaire.</text><rect x="995" y="874" width="390" height="92" rx="0" fill="#eadbd1" stroke="#caae9d"/><text x="1013" y="899" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#923e2d">LIMITE D'INTERPRÉTATION</text><text x="1013" y="924" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4d473d">Ce visuel ne reproduit ni les pourcentages,</text><text x="1013" y="942" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4d473d">ni les barres d'erreur des figures</text><text x="1013" y="960" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4d473d">expérimentales.</text><path d="M54 986L1385 986" fill="none" stroke="#76694e" stroke-width="1.2"/><text x="55" y="1006" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#554d40">PLANCHE 54 / 70  —  reconstruction scientifique conceptuelle, non expérimentale ; consulter la diapositive originale du cours.</text></svg>