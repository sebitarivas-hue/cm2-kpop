="23" fill="#d2e4e1" stroke="#6ba6a1" stroke-width="2"/><circle cx="825" cy="340" r="23" fill="#d2e4e1" stroke="#6ba6a1" stroke-width="2"/><circle cx="600" cy="420" r="15" fill="#be9465" stroke="#5b6a52" stroke-width="2"/><circle cx="675" cy="420" r="23" fill="#d2e4e1" stroke="#6ba6a1" stroke-width="2"/><circle cx="750" cy="420" r="23" fill="#d2e4e1" stroke="#6ba6a1" stroke-width="2"/><circle cx="825" cy="420" r="23" fill="#d2e4e1" stroke="#6ba6a1" stroke-width="2"/><circle cx="600" cy="500" r="15" fill="#be9465" stroke="#5b6a52" stroke-width="2"/><circle cx="675" cy="500" r="23" fill="#d2e4e1" stroke="#6ba6a1" stroke-width="2"/><circle cx="750" cy="500" r="23" fill="#d2e4e1" stroke="#6ba6a1" stroke-width="2"/><circle cx="825" cy="500" r="23" fill="#d2e4e1" stroke="#6ba6a1" stroke-width="2"/><circle cx="600" cy="580" r="15" fill="#be9465" stroke="#5b6a52" stroke-width="2"/><circle cx="675" cy="580" r="23" fill="#d2e4e1" stroke="#6ba6a1" stroke-width="2"/><circle cx="750" cy="580" r="23" fill="#d2e4e1" stroke="#6ba6a1" stroke-width="2"/><circle cx="825" cy="580" r="23" fill="#d2e4e1" stroke="#6ba6a1" stroke-width="2"/><path d="M500 483L548 483" fill="none" stroke="#a53a25" stroke-width="3" marker-end="url(#arrow)"/><text x="303" y="727" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#4c6658">GLACE / NUCLÉATION</text><text x="644" y="727" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#4c6658">INTERACTION LOCALE</text><text x="247" y="798" font-family="Georgia,Times New Roman,serif" font-size="20" font-weight="400" fill="#304f41">La réponse dépend de la cinétique thermique.</text><rect x="995" y="230" width="390" height="620" rx="1" fill="#f1eadc" stroke="#b9ab8e"/><text x="1021" y="272" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#294b3b">MÉCANISME ET POINTS DE CONTRÔLE</text><circle cx="1038" cy="314" r="18" fill="#9c3b27" stroke="#9c3b27" stroke-width="0"/><text x="1032" y="320" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff8ed">1</text><text x="1066" y="316" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#853b2d">01 · REFROIDIR</text><text x="1020" y="351" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">La température et la vitesse de</text><text x="1020" y="373" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">refroidissement contrôlent l'histoire</text><text x="1020" y="395" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">thermique.</text><path d="M1018 427L1360 427" fill="none" stroke="#c7b99f" stroke-width="2"/><circle cx="1038" cy="475" r="18" fill="#9c3b27" stroke="#9c3b27" stroke-width="0"/><text x="1032" y="481" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff8ed">2</text><text x="1066" y="477" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#853b2d">02 · NUCLÉER</text><text x="1020" y="512" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">Les surfaces et solutés peuvent</text><text x="1020" y="534" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">modifier les événements de nucléation.</text><path d="M1018 588L1360 588" fill="none" stroke="#c7b99f" stroke-width="2"/><circle cx="1038" cy="636" r="18" fill="#9c3b27" stroke="#9c3b27" stroke-width="0"/><text x="1032" y="642" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff8ed">3</text><text x="1066" y="638" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#853b2d">03 · ÉVALUER</text><text x="1020" y="673" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">Comparer intégrité, hémolyse et</text><text x="1020" y="695" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">fonction après décongélation.</text><rect x="50" y="874" width="922" height="92" rx="0" fill="#ece6d8" stroke="#c2b497"/><text x="68" y="898" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#294f40">LECTURE SCIENTIFIQUE</text><text x="69" y="923" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#364638">• La formation de glace dépend du milieu, de la cinétique et des interfaces.</text><text x="69" y="942" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#364638">• Un matériau MOF peut modifier les interactions locales sans garantir la cryoprotection.</text><text x="69" y="961" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#364638">• La conservation d'une forme cellulaire n'est pas une preuve de viabilité.</text><rect x="995" y="874" width="390" height="92" rx="0" fill="#eadbd1" stroke="#caae9d"/><text x="1013" y="899" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#923e2d">LIMITE D'INTERPRÉTATION</text><text x="1013" y="924" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4d473d">Aucune température critique ou amélioration</text><text x="1013" y="942" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4d473d">de rendement n'est inférée de ce schéma</text><text x="1013" y="960" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4d473d">conceptuel.</text><path d="M54 986L1385 986" fill="none" stroke="#76694e" stroke-width="1.2"/><text x="55" y="1006" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#554d40">PLANCHE 53 / 70  —  reconstruction scientifique conceptuelle, non expérimentale ; consulter la diapositive originale du cours.</text></svg>