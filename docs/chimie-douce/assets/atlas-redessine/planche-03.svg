text x="68" y="901" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#305340">LECTURE SCIENTIFIQUE</text><text x="68" y="925" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" fill="#455a4a">La figure 3 présente une reconstruction explicative du phénomène « barrières cellulaires et interfaces »,</text><text x="68" y="945" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" fill="#455a4a">sans reproduction de données.</text><rect x="990" y="876" width="397" height="90" fill="#ecddd0" stroke="#c3ad97" stroke-width="1.5"/><text x="1008" y="898" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#96432e">LIMITE SCIENTIFIQUE</text><text x="1007" y="922" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#51463e">Un schéma d'enveloppe ne détermine pas sa charge</text><text x="1007" y="940" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#51463e">ou sa perméabilité in situ.</text><path d="M53 986L1386 986" fill="none" stroke="#837962" stroke-width="2"/><text x="55" y="1007" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#60584c">PLANCHE 3/70 — dessin scientifique conceptuel ; la source primaire fait foi. · Clément Sanchez, Collège de France, 2020.</text></svg>