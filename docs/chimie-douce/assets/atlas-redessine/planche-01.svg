10" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="normal" fill="#34493a">Identifier les familles de matériaux</text><path d="M1014 422L1364 422" fill="none" stroke="#c8baa4" stroke-width="2"/><circle cx="1029" cy="482" r="20" fill="#a24330" stroke="#a24330" stroke-width="0"/><text x="1022" y="490" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#fff7ed">2</text><text x="1059" y="482" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="normal" fill="#34493a">Relier procédés et interfaces</text><path d="M1014 594L1364 594" fill="none" stroke="#c8baa4" stroke-width="2"/><circle cx="1029" cy="654" r="20" fill="#a24330" stroke="#a24330" stroke-width="0"/><text x="1022" y="662" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#fff7ed">3</text><text x="1059" y="654" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="normal" fill="#34493a">Séparer concept et observation</text><rect x="50" y="876" width="925" height="90" fill="#e9ecdf" stroke="#bdbea7" stroke-width="1.5"/><text x="68" y="901" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#305340">LECTURE SCIENTIFIQUE</text><text x="68" y="925" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" fill="#455a4a">La figure 1 présente une reconstruction explicative du phénomène « plan analytique du cours », sans</text><text x="68" y="945" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" fill="#455a4a">reproduction de données.</text><rect x="990" y="876" width="397" height="90" fill="#ecddd0" stroke="#c3ad97" stroke-width="1.5"/><text x="1008" y="898" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#96432e">LIMITE SCIENTIFIQUE</text><text x="1007" y="922" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#51463e">Le plan du cours n'est ni un graphe de résultats</text><text x="1007" y="940" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#51463e">ni une chronologie d'expériences.</text><path d="M53 986L1386 986" fill="none" stroke="#837962" stroke-width="2"/><text x="55" y="1007" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#60584c">PLANCHE 1/70 — dessin scientifique conceptuel ; la source primaire fait foi. · Clément Sanchez, Collège de France, 2020.</text></svg>