ont-weight="bold" fill="#2c4e3d">MÉCANISME ET VÉRIFICATIONS</text><circle cx="1029" cy="310" r="20" fill="#a24330" stroke="#a24330" stroke-width="0"/><text x="1022" y="318" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#fff7ed">1</text><text x="1059" y="310" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="normal" fill="#34493a">Greffer la sonde</text><path d="M1014 422L1364 422" fill="none" stroke="#c8baa4" stroke-width="2"/><circle cx="1029" cy="482" r="20" fill="#a24330" stroke="#a24330" stroke-width="0"/><text x="1022" y="490" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#fff7ed">2</text><text x="1059" y="482" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="normal" fill="#34493a">Exposer à la cible</text><path d="M1014 594L1364 594" fill="none" stroke="#c8baa4" stroke-width="2"/><circle cx="1029" cy="654" r="20" fill="#a24330" stroke="#a24330" stroke-width="0"/><text x="1022" y="662" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#fff7ed">3</text><text x="1059" y="654" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="normal" fill="#34493a">Vérifier la spécificité</text><rect x="50" y="876" width="925" height="90" fill="#e9ecdf" stroke="#bdbea7" stroke-width="1.5"/><text x="68" y="901" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#305340">LECTURE SCIENTIFIQUE</text><text x="68" y="925" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" fill="#455a4a">La figure 48 présente une reconstruction explicative du phénomène « réponse à une sonde fonctionnalisée</text><text x="68" y="945" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="normal" fill="#455a4a">», sans reproduction de données.</text><rect x="990" y="876" width="397" height="90" fill="#ecddd0" stroke="#c3ad97" stroke-width="1.5"/><text x="1008" y="898" font-family="