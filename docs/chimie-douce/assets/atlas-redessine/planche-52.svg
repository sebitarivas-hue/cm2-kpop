font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#8c4834">ENVELOPPE MULTIMATÉRIAUX</text><rect x="995" y="230" width="390" height="620" rx="1" fill="#f1eadc" stroke="#b9ab8e"/><text x="1021" y="272" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#294b3b">MÉCANISME ET POINTS DE CONTRÔLE</text><circle cx="1038" cy="314" r="18" fill="#9c3b27" stroke="#9c3b27" stroke-width="0"/><text x="1032" y="320" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff8ed">1</text><text x="1066" y="316" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#853b2d">01 · ASSEMBLER</text><text x="1020" y="351" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">Une enveloppe mêle des particules de</text><text x="1020" y="373" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">natures différentes.</text><path d="M1018 427L1360 427" fill="none" stroke="#c7b99f" stroke-width="2"/><circle cx="1038" cy="475" r="18" fill="#9c3b27" stroke="#9c3b27" stroke-width="0"/><text x="1032" y="481" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff8ed">2</text><text x="1066" y="477" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#853b2d">02 · CONNECTER</text><text x="1020" y="512" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">Le greffage et les ligands régulent</text><text x="1020" y="534" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">l'attachement en surface.</text><path d="M1018 588L1360 588" fill="none" stroke="#c7b99f" stroke-width="2"/><circle cx="1038" cy="636" r="18" fill="#9c3b27" stroke="#9c3b27" stroke-width="0"/><text x="1032" y="642" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#fff8ed">3</text><text x="1066" y="638" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#853b2d">03 · CARACTÉRISER</text><text x="1020" y="673" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">Contrôler couverture, stabilité,</text><text x="1020" y="695" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#30483a">échange et viabilité.</text><rect x="50" y="874" width="922" height="92" rx="0" fill="#ece6d8" stroke="#c2b497"/><text x="68" y="898" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#294f40">LECTURE SCIENTIFIQUE</text><text x="69" y="923" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#364638">• Plusieurs matériaux peuvent coexister sur une même cellule.</text><text x="69" y="942" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#364638">• L'imagerie, la catalyse ou la protection sont des fonctions possibles, non automatiques.</text><text x="69" y="961" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#364638">• La continuité d'une coque ne démontre pas l'activité biologique.</text><rect x="995" y="874" width="390" height="92" rx="0" fill="#eadbd1" stroke="#caae9d"/><text x="1013" y="899" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#923e2d">LIMITE D'INTERPRÉTATION</text><text x="1013" y="924" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4d473d">Fonctionnalité, biocompatibilité et stabilité</text><text x="1013" y="942" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4d473d">doivent être établies expérimentalement,</text><text x="1013" y="960" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4d473d">chacune avec ses témoins.</text><path d="M54 986L1385 986" fill="none" stroke="#76694e" stroke-width="1.2"/><text x="55" y="1006" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#554d40">PLANCHE 52 / 70  —  reconstruction scientifique conceptuelle, non expérimentale ; consulter la diapositive originale du cours.</text></svg>