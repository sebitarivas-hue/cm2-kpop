  <body>
    <div id="root"></div>
    <!-- Nettoie un éventuel service worker de l'ancienne PWA (proto K-pop)
         pour éviter qu'un cache périmé ne resserve l'ancienne version. -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((rs) => {
          if (rs.length) {
            rs.forEach((r) => r.unregister());
            if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
          }
        });
      }
    </script>
  </body>
